spring:
  config:
    import: application-secret.yml

  datasource:
    url: jdbc:mysql://wingterview.c94aseeus9o9.ap-northeast-2.rds.amazonaws.com:3306/wingterview?useUnicode=true&character_set_server=utf8mb4&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  rabbitmq:
    host: ${AMQP_HOST}
    port: ${AMQP_PORT}
    username: ${AMQP_USERNAME}
    password: ${AMQP_PASSWORD}

rabbitmq:
  queue:
    name: ai.request.queue
  exchange:
    name: ai.request.exchange
  routing:
    key: ai.request.routingKey

oauth:
  kakao:
    token-request-uri: https://kauth.kakao.com/oauth/token
    token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
    redirect-uri: https://wingterview10.com/auth/kakao
    client-id: ${KAKAO_CLIENT_ID}

ai:
  follow-up-url: https://prod-nlb-c0b1c269768967f4.elb.ap-northeast-2.amazonaws.com/interview/followup-questions
  api-key: ${AI_KEY}
  api-url: ${AI_URL}

cloud:
  aws:
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      stack:
        auto: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true